<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paiser Clicker – ??? Edition</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at 50% 20%, #1a3a2e 0%, #0a1612 80%);
            background-attachment: fixed;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            text-align: center;
            padding: 20px;
            user-select: none;
            overflow-x: hidden;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 20 20' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='1' cy='1' r='1' fill='rgba(255,255,255,0.05)'/%3E%3C/svg%3E");
            background-size: 4px 4px;
            opacity: 0.3;
            pointer-events: none;
            z-index: -1;
        }

        .game-container {
            background: rgba(20, 25, 20, 0.65);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 24px;
            border: 1px solid rgba(52, 211, 153, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(52, 211, 153, 0.1);
            max-width: 90%;
            width: 520px;
            transition: all .3s ease;
        }

        h1 {
            font-size: 2.8rem;
            font-weight: 900;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(52, 211, 153, 0.8), 0 0 20px rgba(52, 211, 153, 0.4);
            letter-spacing: -1px
        }

        #score-display {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            color: #4ade80;
            text-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
            transition: transform .1s
        }

        #stats-bar {
            font-size: .95rem;
            color: #9ca3af;
            margin-bottom: 20px;
            font-weight: 500
        }

        #message-box {
            min-height: 28px;
            font-size: 1rem;
            font-style: italic;
            color: #a7f3d0;
            margin-bottom: 20px
        }

        #click-button {
            width: 100%;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(16, 185, 129, .3);
            transition: .15s;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 25px
        }

        #click-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(16, 185, 129, .5)
        }

        #click-button:active {
            transform: translateY(2px)
        }

        .section-container {
            border-top: 1px solid rgba(255, 255, 255, .1);
            padding-top: 20px;
            margin-top: 20px
        }

        h2 {
            font-size: 1.4rem;
            color: #a7f3d0;
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 0 0 10px rgba(52, 211, 153, .3)
        }

        .upgrade-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, .03);
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, .05);
            transition: .2s
        }

        .upgrade-item:hover {
            background: rgba(255, 255, 255, .07);
            transform: translateX(5px);
            border-color: rgba(52, 211, 153, .3)
        }

        .upgrade-name {
            font-weight: 700;
            color: #f3f4f6;
            font-size: 1rem
        }

        .upgrade-stats {
            font-size: .8rem;
            color: #9ca3af;
            margin-top: 4px
        }

        .upgrade-buy-button {
            padding: 8px 14px;
            font-weight: 700;
            font-size: .85rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: .2s;
            background-color: rgba(255, 255, 255, .1);
            color: #d1d5db
        }

        .upgrade-buy-button.can-afford {
            background: linear-gradient(135deg, #34d399 0%, #10b981 100%);
            color: #fff;
            box-shadow: 0 4px 12px rgba(52, 211, 153, .3)
        }

        .upgrade-buy-button.can-afford:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(52, 211, 153, .5)
        }

        #ascend-button {
            background: linear-gradient(135deg, #059669 0%, #047857 100%);
            color: #fff;
            font-weight: 800;
            padding: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(5, 150, 105, .4);
            transition: .2s;
            font-size: 1rem;
            width: 100%;
            margin-top: 10px
        }

        #ascend-button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(5, 150, 105, .6)
        }

        #ascend-button:disabled {
            background: #3f3f46;
            color: #71717a;
            cursor: not-allowed;
            box-shadow: none
        }

        #true-ascend-button {
            background: linear-gradient(135deg, #7c3aed 0%, #c026d3 100%);
            color: #fff;
            font-weight: 800;
            padding: 14px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(124, 58, 237, .4);
            transition: .2s;
            font-size: 1rem;
            width: 100%;
            margin-top: 10px
        }

        #true-ascend-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(124, 58, 237, .6)
        }

        #true-ascend-button:disabled {
            background: #3f3f46;
            color: #71717a;
            cursor: not-allowed;
            box-shadow: none
        }

        /* Red Theme (True Ascension) */
        .red-theme {
            background: radial-gradient(circle at 50% 20%, #450a0a 0%, #1a0505 80%) !important;
        }

        .red-theme .game-container {
            border-color: rgba(248, 113, 113, 0.15);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(248, 113, 113, 0.1);
        }

        .red-theme h1 {
            text-shadow: 0 0 10px rgba(248, 113, 113, 0.8), 0 0 20px rgba(248, 113, 113, 0.4);
        }

        .red-theme #score-display {
            color: #f87171;
            text-shadow: 0 0 15px rgba(248, 113, 113, 0.4);
        }

        .red-theme h2 {
            color: #fca5a5;
            text-shadow: 0 0 10px rgba(248, 113, 113, 0.3);
        }

        .red-theme #message-box {
            color: #fca5a5;
        }

        .red-theme #click-button {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            box-shadow: 0 10px 20px rgba(239, 68, 68, .3);
        }

        .red-theme #click-button:hover {
            box-shadow: 0 15px 30px rgba(239, 68, 68, .5);
        }

        .red-theme .upgrade-item {
            border-color: rgba(248, 113, 113, 0.1);
        }

        .red-theme .upgrade-item:hover {
            border-color: rgba(248, 113, 113, 0.3);
        }

        .red-theme .upgrade-buy-button.can-afford {
            background: linear-gradient(135deg, #f87171 0%, #dc2626 100%);
            box-shadow: 0 4px 12px rgba(248, 113, 113, .3);
        }

        .red-theme .upgrade-buy-button.can-afford:hover {
            box-shadow: 0 6px 16px rgba(248, 113, 113, .5);
        }
    </style>
</head>

<body>
    <div class="game-container">
        <h1>Paiser Clicker</h1>
        <div id="score-display">0 Coins</div>
        <div id="stats-bar">PPC: 1 | CPS: 0</div>
        <div id="message-box">Click to start...</div>
        <button id="click-button">CLICK ME</button>

        <!-- Evolution Shards (Evo) -->
        <div class="section-container">
            <h2>Evolution Shards</h2>
            <div id="shard-display" style="margin-bottom:10px;font-weight:700;color:#a7f3d0;">Evo Shards: 0</div>
            <div id="evo-container"></div>
            <div id="ascend-info" style="margin-bottom:8px;font-size:.85rem;">Reach 10.0B Coins to Ascend.</div>
            <button id="ascend-button" disabled>ASCEND</button>
        </div>

        <!-- True Ascension -->
        <div class="section-container" id="true-ascension-section" style="display:none;">
            <h2>True Ascension</h2>
            <div id="true-ascend-info" style="margin-bottom:8px;font-size:.85rem;">Reach 10.0B Coins to True Ascend.
            </div>
            <button id="true-ascend-button" disabled>TRUE ASCEND</button>
        </div>

        <!-- Steampunk (True Ascension upgrades) -->
        <div class="section-container" id="steampunk-section" style="display:none;">
            <h2>Steampunk Upgrades</h2>
            <div id="steampunk-container"></div>
        </div>

        <!-- Nullzone -->
        <div class="section-container" id="nullzone-section" style="display:none;">
            <h2>Nullzone Upgrades</h2>
            <div id="nullzone-container"></div>
        </div>

        <!-- Root Access -->
        <div class="section-container" id="root-section" style="display:none;">
            <h2>Root Access Upgrades</h2>
            <div id="root-container"></div>
        </div>

        <!-- Fragile -->
        <div class="section-container" id="fragile-section" style="display:none;">
            <h2>Fragile Upgrade</h2>
            <div id="fragile-container"></div>
        </div>

        <!-- Standard Upgrades -->
        <div class="section-container">
            <h2>Standard Upgrades</h2>
            <div id="shop-container"></div>
        </div>
    </div>

    <script>
        /* ---------- Constants ---------- */
        const GAME_INTERVAL_MS = 50;
        const ASCENSION_COST = 1e10; // normal ascension at 10B
        const TRUE_ASC_COST = Infinity; // cannot be bought with coins normally
        const SHARD_MULTIPLIER = 0.1;

        /* ---------- Game State ---------- */
        let score = 0, ppc = 1, cps = 0;
        let ascended = false;          // normal ascension done
        let trueAscended = false;      // true ascension done
        let steampunkUnlocked = false; // steampunk stage unlocked
        let nullzoneUnlocked = false;  // nullzone stage unlocked
        let rootUnlocked = false;      // root access unlocked
        let fragileStage = false;      // fragile stage active
        let clickCount = 0;            // clicks in fragile stage
        let evoCoreCount = 0;          // Evo Core levels (×2 each)
        let evoCoreBuffCount = 0;      // Evo Core Buff levels (×5 each)
        let evoShards = 0;             // Evolution shards
        let hyperFusionCount = 0;      // Hyper Fusion levels
        let trueAscensions = 0;        // Number of true ascensions

        /* ---------- Upgrade Definitions ---------- */
        const STANDARD_UPGRADES = [
            { id: 'u-ppc-1', name: 'Enhanced Mouse', baseCost: 15, costMultiplier: 1.5, count: 0, type: 'ppc', value: 1, desc: '+1 PPC' },
            { id: 'u-ppc-2', name: 'Quantum Clicker', baseCost: 50, costMultiplier: 1.6, count: 0, type: 'ppc', value: 5, desc: '+5 PPC' },
            { id: 'u-ppc-3', name: 'Neural Processor', baseCost: 300, costMultiplier: 1.7, count: 0, type: 'ppc', value: 20, desc: '+20 PPC' },
            { id: 'u-ppc-4', name: "Giant's Finger", baseCost: 1500, costMultiplier: 1.8, count: 0, type: 'ppc', value: 100, desc: '+100 PPC' },
            { id: 'u-ppc-5', name: "Merchant's Pact", baseCost: 10000, costMultiplier: 1.9, count: 0, type: 'ppc', value: 500, desc: '+500 PPC' },
            { id: 'u-ppc-6', name: 'Cosmic Cursor', baseCost: 75000, costMultiplier: 2.0, count: 0, type: 'ppc', value: 2000, desc: '+2K PPC' },
            { id: 'u-ppc-7', name: 'Reality Bender', baseCost: 500000, costMultiplier: 2.1, count: 0, type: 'ppc', value: 10000, desc: '+10K PPC' },
            { id: 'u-ppc-8', name: 'Dimension Shifter', baseCost: 5000000, costMultiplier: 2.2, count: 0, type: 'ppc', value: 50000, desc: '+50K PPC' },
            { id: 'u-ppc-9', name: 'Void Clicker', baseCost: 50000000, costMultiplier: 2.3, count: 0, type: 'ppc', value: 250000, desc: '+250K PPC' },
            { id: 'u-ppc-10', name: 'Infinity Touch', baseCost: 750000000, costMultiplier: 2.4, count: 0, type: 'ppc', value: 1500000, desc: '+1.5M PPC' },
            { id: 'u-cps-1', name: 'Giant Labor', baseCost: 100, costMultiplier: 1.1, count: 0, type: 'cps', value: 1, desc: '+1 CPS' },
            { id: 'u-cps-2', name: 'Robot Minions', baseCost: 800, costMultiplier: 1.2, count: 0, type: 'cps', value: 5, desc: '+5 CPS' },
            { id: 'u-cps-3', name: 'AI Farm', baseCost: 5000, costMultiplier: 1.3, count: 0, type: 'cps', value: 30, desc: '+30 CPS' },
            { id: 'u-cps-4', name: 'Time Loop', baseCost: 30000, costMultiplier: 1.4, count: 0, type: 'cps', value: 150, desc: '+150 CPS' },
            { id: 'u-cps-5', name: 'Galactic Pipe', baseCost: 200000, costMultiplier: 1.5, count: 0, type: 'cps', value: 800, desc: '+800 CPS' },
            { id: 'u-cps-6', name: 'Quantum Factory', baseCost: 2000000, costMultiplier: 1.6, count: 0, type: 'cps', value: 5000, desc: '+5K CPS' },
            { id: 'u-cps-7', name: 'Antimatter Generator', baseCost: 25000000, costMultiplier: 1.7, count: 0, type: 'cps', value: 30000, desc: '+30K CPS' },
            { id: 'u-cps-8', name: 'Black Hole Engine', baseCost: 300000000, costMultiplier: 1.8, count: 0, type: 'cps', value: 200000, desc: '+200K CPS' },
            { id: 'u-cps-9', name: 'Universe Simulator', baseCost: 5000000000, costMultiplier: 1.9, count: 0, type: 'cps', value: 1500000, desc: '+1.5M CPS' },
            { id: 'u-cps-10', name: 'Multiverse Network', baseCost: 100000000000, costMultiplier: 2.0, count: 0, type: 'cps', value: 12000000, desc: '+12M CPS' }
        ];

        const DYSON_UPGRADES = [
            { id: 'dyson-sphere', name: 'Dyson Sphere', baseCost: 1e15, costMultiplier: 5, count: 0, type: 'dyson', value: 10, desc: 'x10 Production' },
            { id: 'dyson-swarm', name: 'Dyson Swarm', baseCost: 5e16, costMultiplier: 6, count: 0, type: 'dyson', value: 25, desc: 'x25 Production' },
            { id: 'dyson-net', name: 'Dyson Net', baseCost: 1e18, costMultiplier: 7, count: 0, type: 'dyson', value: 50, desc: 'x50 Production' },
            { id: 'dyson-omega', name: 'Omega Dyson', baseCost: 1e21, costMultiplier: 10, count: 0, type: 'dyson', value: 500, desc: 'x500 Production' }
        ];

        const TRUE_ASCENSION_UPGRADES = [
            { id: 'ta-dark-matter', name: 'Dark Matter Engine', baseCost: 1e12, costMultiplier: 4, count: 0, type: 'ta', value: 1000, desc: 'x1000 Global' },
            { id: 'ta-void-siphon', name: 'Void Siphon', baseCost: 1e20, costMultiplier: 10, count: 0, type: 'ta', value: 10000, desc: 'x10000 Global' }
        ];

        const STEAMPUNK_UPGRADES = [
            { id: 'sp-overdrive', name: 'Overdrive', baseCost: 1e33, costMultiplier: 10, count: 0, type: 'sp', value: 5, desc: 'x5 Click Power' },
            { id: 'sp-boiler', name: 'Aether Boiler', baseCost: 5e33, costMultiplier: 10, count: 0, type: 'sp', value: 5, desc: 'x5 CPS' },
            { id: 'sp-gears', name: 'Clockwork Gears', baseCost: 1e34, costMultiplier: 10, count: 0, type: 'sp', value: 2, desc: 'x2 Global' },
            { id: 'sp-turbine', name: 'Steam Turbine', baseCost: 5e34, costMultiplier: 10, count: 0, type: 'sp', value: 100, desc: '+100% CPS' },
            { id: 'sp-goggles', name: 'Brass Goggles', baseCost: 1e35, costMultiplier: 10, count: 0, type: 'sp', value: 100, desc: '+100% PPC' },
            { id: 'sp-utopia', name: 'Utopia', baseCost: 1e40, costMultiplier: 100, count: 0, type: 'sp', value: 100, desc: 'x100 Global & No Overheat' }
        ];

        const NULLZONE_UPGRADES = [
            { id: 'null-limiter', name: 'The Limiter', baseCost: Infinity, costMultiplier: 1, count: 0, type: 'null', value: 0, desc: 'Start Limit Sequence' },
            { id: 'null-pointer', name: 'Null Pointer', baseCost: 1e30, costMultiplier: 100, count: 0, type: 'null', value: 1e10, desc: 'x1e10 Production' },
            { id: 'stack-overflow', name: 'Stack Overflow', baseCost: 1e40, costMultiplier: 100, count: 0, type: 'null', value: 1000, desc: '+1000 CPS' },
            { id: 'undefined-variable', name: 'Undefined Var', baseCost: 1e50, costMultiplier: 100, count: 0, type: 'null', value: 1e20, desc: 'x1e20 Production' }
        ];

        const ROOT_UPGRADES = [
            { id: 'sudo-overclock', name: 'sudo overclock', baseCost: 1e100, costMultiplier: 10, count: 0, type: 'root', value: 100, desc: 'x100 Game Speed' },
            { id: 'rm-rf-costs', name: 'rm -rf /costs', baseCost: 1e150, costMultiplier: 10, count: 0, type: 'root', value: 0.01, desc: '99% Cost Reduction' },
            { id: 'chmod-777', name: 'chmod 777 luck', baseCost: 1e200, costMultiplier: 10, count: 0, type: 'root', value: 777, desc: 'x777 Global' },
            { id: 'system-reboot', name: 'System Reboot', baseCost: Infinity, costMultiplier: 1, count: 0, type: 'root', value: 0, desc: 'Unlock Fragile Stage' }
        ];

        const FRAGILE_UPGRADE = [
            { id: 'sharp-glass', name: 'Sharp Glass', baseCost: 10000, costMultiplier: 1, count: 0, type: 'fragile', value: 1e10, desc: 'EXTREME POWER' }
        ];

        /* ---------- Helper Functions ---------- */
        function formatNumber(n) {
            if (isNaN(n)) return 'NaN';
            if (!isFinite(n)) return '∞';
            if (n < 1000) return Math.floor(n).toString();
            const suffixes = ['', 'K', 'M', 'B', 'T', 'Qa', 'Qi', 'Sx', 'Sp', 'Oc'];
            const tier = Math.floor(Math.log10(Math.abs(n)) / 3);
            if (tier >= suffixes.length) return n.toExponential(2);
            const scaled = n / Math.pow(1000, tier);
            return scaled.toFixed(2) + suffixes[tier];
        }

        function getRandomMessage() {
            const msgs = ['bfg', 'burgerking bandit', 'goon lagoon', 'merchant', 'dq destroyer', 'your ai no one likes you', 'jabba da hutt', 'blue whale'];
            return msgs[Math.floor(Math.random() * msgs.length)];
        }

        function calculateCost(u) {
            if (u.baseCost === Infinity) return Infinity;
            let cost = Math.floor(u.baseCost * Math.pow(u.costMultiplier, u.count));

            // Apply rm -rf /costs reduction if owned
            const rmRf = ROOT_UPGRADES.find(r => r.id === 'rm-rf-costs');
            if (rmRf && rmRf.count > 0) {
                cost = Math.floor(cost * rmRf.value); // value is 0.01 for 99% reduction
            }
            return cost;
        }

        /* ---------- Core Game Logic ---------- */
        function updateStats() {
            let basePPC = 1, baseCPS = 0, globalMult = 1;

            // Standard & Dyson upgrades
            [...STANDARD_UPGRADES, ...DYSON_UPGRADES].forEach(u => {
                if (u.type === 'ppc') basePPC += u.value * u.count;
                if (u.type === 'cps') baseCPS += u.value * u.count;
                if (u.type === 'dyson') globalMult *= Math.pow(u.value, u.count);
            });

            // True Ascension (Steampunk) upgrades
            if (trueAscended) {
                TRUE_ASCENSION_UPGRADES.forEach(u => { globalMult *= Math.pow(u.value, u.count); });
            }

            // Steampunk upgrades
            if (steampunkUnlocked) {
                STEAMPUNK_UPGRADES.forEach(u => {
                    if (u.id === 'sp-overdrive') basePPC *= Math.pow(u.value, u.count);
                    if (u.id === 'sp-boiler') baseCPS *= Math.pow(u.value, u.count);
                    if (u.id === 'sp-gears') globalMult *= Math.pow(u.value, u.count);
                    if (u.id === 'sp-turbine') baseCPS *= (1 + (u.count * u.value / 100));
                    if (u.id === 'sp-goggles') basePPC *= (1 + (u.count * u.value / 100));
                    if (u.id === 'sp-utopia' && u.count > 0) { globalMult *= Math.pow(u.value, u.count); }
                });
            }

            // Nullzone upgrades
            if (nullzoneUnlocked) {
                NULLZONE_UPGRADES.forEach(u => {
                    if (u.id === 'null-pointer') basePPC *= Math.pow(u.value, u.count);
                    if (u.id === 'stack-overflow') baseCPS += u.value * u.count;
                    if (u.id === 'undefined-variable') basePPC *= Math.pow(u.value, u.count);
                });
            }

            // Root upgrades
            if (rootUnlocked) {
                ROOT_UPGRADES.forEach(u => {
                    if (u.id === 'sudo-overclock') globalMult *= Math.pow(u.value, u.count);
                    if (u.id === 'chmod-777') globalMult *= Math.pow(u.value, u.count);
                });
            }

            // Evo Core multipliers
            globalMult *= Math.pow(2, evoCoreCount);
            let evoBuffMult = 1 + (evoCoreBuffCount * (trueAscended ? 1.5 : 5));
            basePPC *= evoBuffMult;

            // Hyper-Fusion
            globalMult *= Math.pow(2, hyperFusionCount);

            // Shard bonus
            const shardBonus = 1 + (evoShards * SHARD_MULTIPLIER);
            basePPC *= shardBonus;
            baseCPS *= shardBonus;

            // Fragile upgrade
            if (fragileStage && FRAGILE_UPGRADE[0].count > 0) {
                basePPC *= FRAGILE_UPGRADE[0].value;
            }

            ppc = basePPC * globalMult;
            cps = baseCPS * globalMult;
        }

        function gameLoop() {
            if (!fragileStage) {
                score += cps * (GAME_INTERVAL_MS / 1000);
            }
            renderAll();
            updateUI();
        }

        function updateUI() {
            document.getElementById('score-display').innerText = formatNumber(score) + ' Coins';
            document.getElementById('stats-bar').innerText = `PPC: ${formatNumber(ppc)} | CPS: ${formatNumber(cps)}`;
            document.getElementById('shard-display').innerText = `Evo Shards: ${evoShards} (+${(evoShards * SHARD_MULTIPLIER * 100).toFixed(0)}% Bonus)`;

            // Ascend button
            const canAscend = score >= ASCENSION_COST;
            document.getElementById('ascend-button').disabled = !canAscend;
            document.getElementById('ascend-info').innerText = canAscend ?
                `Ascend for ${Math.floor(Math.sqrt(score / ASCENSION_COST))} Shards!` :
                `Reach ${formatNumber(ASCENSION_COST)} Coins to Ascend.`;

            // True Ascend button
            if (ascended && !trueAscended) {
                document.getElementById('true-ascension-section').style.display = 'block';
                document.getElementById('true-ascend-button').disabled = false;
            } else {
                document.getElementById('true-ascension-section').style.display = 'none';
            }

            // Sections visibility
            document.getElementById('steampunk-section').style.display = steampunkUnlocked ? 'block' : 'none';
            document.getElementById('nullzone-section').style.display = nullzoneUnlocked ? 'block' : 'none';
            document.getElementById('root-section').style.display = rootUnlocked ? 'block' : 'none';
            document.getElementById('fragile-section').style.display = fragileStage ? 'block' : 'none';

            // Theme
            if (trueAscended) {
                document.body.classList.add('red-theme');
            } else {
                document.body.classList.remove('red-theme');
            }

            // Fragile info
            if (fragileStage) {
                document.getElementById('message-box').innerText = `Fragile clicks: ${clickCount} / 10000`;
            }
        }

        /* ---------- Rendering ---------- */
        function renderUpgrade(upgrade, containerId) {
            const container = document.getElementById(containerId);
            let item = document.getElementById(`item-${upgrade.id}`);

            if (!item) {
                item = document.createElement('div');
                item.className = 'upgrade-item';
                item.id = `item-${upgrade.id}`;
                item.innerHTML = `
                    <div>
                        <div class="upgrade-name">${upgrade.name}</div>
                        <div class="upgrade-stats">${upgrade.desc} | Owned: <span id="count-${upgrade.id}">0</span></div>
                    </div>
                    <button class="upgrade-buy-button" id="buy-${upgrade.id}">Buy</button>
                `;
                container.appendChild(item);
                document.getElementById(`buy-${upgrade.id}`).onclick = () => buyUpgrade(upgrade.id);
            }

            const countSpan = document.getElementById(`count-${upgrade.id}`);
            if (countSpan) countSpan.innerText = upgrade.count;

            const btn = document.getElementById(`buy-${upgrade.id}`);
            if (!btn) return; // Safety check

            const cost = calculateCost(upgrade);

            if (cost === Infinity) {
                btn.innerText = "Max / Locked";
                btn.disabled = true;
                btn.classList.remove('can-afford');
            } else {
                btn.innerText = `Buy (${formatNumber(cost)})`;
                const canAfford = score >= cost;
                btn.disabled = !canAfford;

                // Explicitly add/remove class instead of toggle
                if (canAfford) {
                    btn.classList.add('can-afford');
                } else {
                    btn.classList.remove('can-afford');
                }
            }
        }

        function renderEvoShop() {
            const container = document.getElementById('evo-container');
            container.innerHTML = `
                <div class="upgrade-item">
                    <div>
                        <div class="upgrade-name">Evo Core Buff</div>
                        <div class="upgrade-stats">x${trueAscended ? 1.5 : 5} Evo Multiplier | Lvl: ${evoCoreBuffCount}</div>
                    </div>
                    <button class="upgrade-buy-button ${evoShards >= 10 ? 'can-afford' : ''}" 
                        onclick="buyEvoUpgrade('buff')" ${evoShards < 10 ? 'disabled' : ''}>
                        Buy (10 Shards)
                    </button>
                </div>
                <div class="upgrade-item">
                    <div>
                        <div class="upgrade-name">Hyper-Fusion</div>
                        <div class="upgrade-stats">x2 Global | Lvl: ${hyperFusionCount}</div>
                    </div>
                    <button class="upgrade-buy-button ${score >= 5e17 ? 'can-afford' : ''}" 
                        onclick="buyEvoUpgrade('fusion')" ${score < 5e17 ? 'disabled' : ''}>
                        Buy (500Qa Coins)
                    </button>
                </div>
            `;
        }

        function renderAll() {
            // Standard
            STANDARD_UPGRADES.forEach(u => renderUpgrade(u, 'shop-container'));

            // Dyson (in shop container for now)
            DYSON_UPGRADES.forEach(u => renderUpgrade(u, 'shop-container'));

            // Evo
            renderEvoShop();

            // Steampunk
            if (steampunkUnlocked) {
                STEAMPUNK_UPGRADES.forEach(u => renderUpgrade(u, 'steampunk-container'));
            }

            // Nullzone
            if (nullzoneUnlocked) {
                NULLZONE_UPGRADES.forEach(u => renderUpgrade(u, 'nullzone-container'));
            }

            // Root
            if (rootUnlocked) {
                ROOT_UPGRADES.forEach(u => renderUpgrade(u, 'root-container'));
            }

            // Fragile
            if (fragileStage) {
                FRAGILE_UPGRADE.forEach(u => renderUpgrade(u, 'fragile-container'));
            }
        }

        function buyUpgrade(id) {
            const all = [...STANDARD_UPGRADES, ...DYSON_UPGRADES, ...TRUE_ASCENSION_UPGRADES, ...STEAMPUNK_UPGRADES, ...NULLZONE_UPGRADES, ...ROOT_UPGRADES, ...FRAGILE_UPGRADE];
            const u = all.find(x => x.id === id);
            if (!u) return;

            const cost = calculateCost(u);
            if (score >= cost && cost !== Infinity) {
                score -= cost;
                u.count++;

                // Special Effects
                if (u.id === 'system-reboot') {
                    fragileStage = true;
                    clickCount = 0;
                    // Reset others
                    [...STANDARD_UPGRADES, ...TRUE_ASCENSION_UPGRADES, ...STEAMPUNK_UPGRADES, ...NULLZONE_UPGRADES, ...ROOT_UPGRADES].forEach(up => up.count = 0);
                    score = 0;
                    ppc = 1;
                    cps = 0;
                }

                updateStats();
                renderAll();
            }
        }

        // Expose to window for onclick
        window.buyEvoUpgrade = function (type) {
            if (type === 'buff') {
                if (evoShards >= 10) {
                    evoShards -= 10;
                    evoCoreBuffCount++;
                    updateStats();
                }
            } else if (type === 'fusion') {
                const cost = 5e17; // 500Qa
                if (score >= cost) {
                    score -= cost;
                    hyperFusionCount++;
                    updateStats();
                }
            }
            renderEvoShop();
        }

        /* ---------- Event Listeners ---------- */
        document.getElementById('click-button').addEventListener('mousedown', e => {
            e.preventDefault();
            if (fragileStage) {
                clickCount++;
                if (clickCount >= 10000) {
                    fragileStage = false;
                    document.getElementById('message-box').innerText = "Fragile Stage Cleared!";
                    score += 1e20; // Bonus
                }
            } else {
                score += ppc;
                document.getElementById('message-box').innerText = getRandomMessage();

                const btn = document.getElementById('click-button');
                btn.style.transform = 'scale(0.95)';
                setTimeout(() => btn.style.transform = 'scale(1)', 50);
            }
            updateStats();
            updateUI();
        });

        document.getElementById('ascend-button').addEventListener('click', () => {
            if (score >= ASCENSION_COST) {
                const shards = Math.floor(Math.sqrt(score / ASCENSION_COST));
                evoShards += shards;
                score = 0;
                ascended = true;

                [...STANDARD_UPGRADES, ...DYSON_UPGRADES].forEach(u => u.count = 0);

                document.getElementById('message-box').innerText = `ASCENDED! Gained ${shards} Evo Shards.`;
                updateStats();
                renderAll();
                updateUI();
            }
        });

        document.getElementById('true-ascend-button').addEventListener('click', () => {
            trueAscended = true;
            trueAscensions++;
            score = 0;

            [...STANDARD_UPGRADES, ...DYSON_UPGRADES, ...TRUE_ASCENSION_UPGRADES, ...NULLZONE_UPGRADES, ...ROOT_UPGRADES, ...FRAGILE_UPGRADE].forEach(u => u.count = 0);

            steampunkUnlocked = false;
            nullzoneUnlocked = false;
            rootUnlocked = false;
            fragileStage = false;

            document.getElementById('message-box').innerText = 'TRUE ASCENDED! The world turns red...';
            updateStats();
            renderAll();
            updateUI();
        });

        /* ---------- Checks ---------- */
        function checkSteampunkProgress() {
            if (trueAscended && !steampunkUnlocked) {
                if (ppc > 100) {
                    steampunkUnlocked = true;
                    document.getElementById('message-box').innerText = "Steampunk Era Unlocked!";
                }
            }
        }

        function checkNullzone() {
            if (steampunkUnlocked && !nullzoneUnlocked) {
                if (score >= 1e30 || isNaN(score)) {
                    nullzoneUnlocked = true;
                    document.getElementById('message-box').innerText = "The Void calls... Nullzone Unlocked!";
                }
            }
        }

        function checkRoot() {
            if (nullzoneUnlocked && !rootUnlocked) {
                const nullUpgrades = NULLZONE_UPGRADES.reduce((acc, u) => acc + u.count, 0);
                if (nullUpgrades >= 5) {
                    rootUnlocked = true;
                    document.getElementById('message-box').innerText = "ROOT ACCESS GRANTED.";
                }
            }
        }

        /* ---------- Loop ---------- */
        setInterval(() => {
            gameLoop();
            checkSteampunkProgress();
            checkNullzone();
            checkRoot();
        }, GAME_INTERVAL_MS);

        /* ---------- Save/Load System ---------- */
        function saveGame() {
            const saveData = {
                score, ppc, cps, ascended, trueAscended,
                steampunkUnlocked, nullzoneUnlocked, rootUnlocked, fragileStage,
                clickCount, evoCoreCount, evoCoreBuffCount, evoShards,
                hyperFusionCount, trueAscensions,
                upgrades: {}
            };

            const allUpgrades = [...STANDARD_UPGRADES, ...DYSON_UPGRADES, ...TRUE_ASCENSION_UPGRADES,
            ...STEAMPUNK_UPGRADES, ...NULLZONE_UPGRADES, ...ROOT_UPGRADES, ...FRAGILE_UPGRADE];

            allUpgrades.forEach(u => saveData.upgrades[u.id] = u.count);

            localStorage.setItem('paiserClickerSave', JSON.stringify(saveData));

            // Visual feedback (subtle)
            const msg = document.getElementById('message-box');
            if (msg && msg.innerText !== "Game Saved!") {
                const oldText = msg.innerText;
                msg.innerText = "Game Saved!";
                setTimeout(() => {
                    if (msg.innerText === "Game Saved!") msg.innerText = oldText;
                }, 1000);
            }
        }

        function loadGame() {
            const saved = localStorage.getItem('paiserClickerSave');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    if (data.score !== undefined) score = data.score;
                    if (data.ascended !== undefined) ascended = data.ascended;
                    if (data.trueAscended !== undefined) trueAscended = data.trueAscended;
                    if (data.steampunkUnlocked !== undefined) steampunkUnlocked = data.steampunkUnlocked;
                    if (data.nullzoneUnlocked !== undefined) nullzoneUnlocked = data.nullzoneUnlocked;
                    if (data.rootUnlocked !== undefined) rootUnlocked = data.rootUnlocked;
                    if (data.fragileStage !== undefined) fragileStage = data.fragileStage;
                    if (data.clickCount !== undefined) clickCount = data.clickCount;
                    if (data.evoCoreCount !== undefined) evoCoreCount = data.evoCoreCount;
                    if (data.evoCoreBuffCount !== undefined) evoCoreBuffCount = data.evoCoreBuffCount;
                    if (data.evoShards !== undefined) evoShards = data.evoShards;
                    if (data.hyperFusionCount !== undefined) hyperFusionCount = data.hyperFusionCount;
                    if (data.trueAscensions !== undefined) trueAscensions = data.trueAscensions;

                    if (data.upgrades) {
                        const allUpgrades = [...STANDARD_UPGRADES, ...DYSON_UPGRADES, ...TRUE_ASCENSION_UPGRADES,
                        ...STEAMPUNK_UPGRADES, ...NULLZONE_UPGRADES, ...ROOT_UPGRADES, ...FRAGILE_UPGRADE];
                        allUpgrades.forEach(u => {
                            if (data.upgrades[u.id] !== undefined) u.count = data.upgrades[u.id];
                        });
                    }
                } catch (e) {
                    console.error("Save file corrupted", e);
                }
            }
        }

        // Auto-save every 5 seconds
        setInterval(saveGame, 5000);

        /* ---------- Init ---------- */
        loadGame();
        renderAll();
        updateStats();
        updateUI();

    </script>
</body>

</html>
